name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Cloudflare Pages deployment
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "The CLOUDFLARE_DEPLOY_HOOK_URL repository secret is not set" >&2
            exit 1
          fi
          curl -sS --fail -X POST "$DEPLOY_HOOK_URL"
